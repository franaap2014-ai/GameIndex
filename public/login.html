<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Login | GameIndex Beta 0.992</title><script src="/js/theme-bootstrap.js"></script><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/gameindex-0986.css?v=0991"><script src="/js/shell-0986.js?v=09915" defer></script><script src="/js/cinematic-0991-hf1.js?v=0991hf1" defer></script><script src="/js/gameindex-0991.js?v=0991" defer></script><script src="/js/auth.js?v=0986" defer></script><link rel="stylesheet" href="/css/gameindex-0991-hf1.css?v=0991hf1"><link rel="stylesheet" href="/css/stability-0992-i1.css?v=0992i1"><link rel="icon" type="image/svg+xml" href="/assets/brand/index-emblem.svg"></head><body data-page="login"><div id="siteShell"></div><main class="page-wrap narrow-page"><section class="simple-hero"><p class="section-eyebrow">CONTA · Beta 0.992</p><h1 data-i18n="auth.headline">Seu GameIndex.</h1><p data-i18n="auth.support">Entre ou crie uma conta. A sessão é confirmada antes do redirecionamento.</p></section><section class="auth-card"><div class="segmented"><button class="active" data-auth-mode="login">Entrar</button><button data-auth-mode="register">Criar conta</button></div><form id="authForm" class="stack-form"><label id="nameField" class="hidden">Nome<input id="displayName" autocomplete="name" placeholder="Como quer aparecer"></label><label id="usernameField" class="hidden">Nome de usuário<input id="username" autocomplete="username" minlength="3" maxlength="30" pattern="[A-Za-z0-9_]+" placeholder="Ex.: Franchesco01"></label><label>E-mail<input id="email" type="email" autocomplete="email" required placeholder="voce@exemplo.com"></label><label>Senha<input id="password" type="password" autocomplete="current-password" minlength="8" required placeholder="Mínimo de 8 caracteres"></label><button class="button primary-button full-button" id="authSubmit">Entrar</button><p id="authMessage" class="form-message" role="status" aria-live="polite" tabindex="-1"></p></form><form id="twoFactorForm" class="stack-form hidden"><p><strong>Confirmação em duas etapas</strong></p><p id="twoFactorHint">Digite o código enviado ao seu e-mail.</p><label>Código<input id="twoFactorCode" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="000000" required></label><button class="button primary-button full-button" id="twoFactorSubmit">Confirmar</button><button class="button ghost-button full-button" id="resendTwoFactor" type="button">Reenviar código</button><button class="button ghost-button full-button" id="cancelTwoFactor" type="button">Cancelar</button><p id="twoFactorMessage" class="form-message"></p></form><div id="accountPanel" class="hidden"></div></section></main></body></html>
