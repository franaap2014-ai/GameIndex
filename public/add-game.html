<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Add Game V2 | GameIndex Admin</title><script src="/js/theme-bootstrap.js"></script><link rel="stylesheet" href="/css/style.css"><script src="/js/shell-0986.js?v=0991" defer></script><script src="/js/cinematic-0991-hf1.js?v=0991hf1" defer></script><script src="/js/gameindex-0991.js?v=0991" defer></script><script src="/js/add-game.js" defer></script><link rel="stylesheet" href="/css/gameindex-0986.css?v=0991"><link rel="stylesheet" href="/css/gameindex-0991-hf1.css?v=0991hf1"><link rel="stylesheet" href="/css/stability-0992-i1.css?v=0992i1"><link rel="icon" type="image/svg+xml" href="/assets/brand/index-emblem.svg"></head><body data-page="add-game"><div id="siteShell"></div><main class="page-wrap narrow-page"><section class="simple-hero"><p class="section-eyebrow">ADMIN · ADD GAME V2</p><h1>Adicionar jogo</h1><p>O jogo entra como rascunho. Conhecimento inicial e artigos são criados de forma conservadora, e imagens fornecidas permanecem em revisão até passarem pelo Image Intelligence.</p></section><div id="addGameGate" class="content-skeleton"></div><form id="addGameForm" class="settings-card stack-form" hidden><div class="form-grid"><label>Nome<input id="newGameName" required maxlength="120"></label><label>Slug<input id="newGameSlug" placeholder="opcional"></label><label>Template<select id="newGameTemplate"><option value="generic">Generic</option><option value="sandbox">Sandbox</option><option value="fps">FPS</option><option value="battle-royale">Battle Royale</option><option value="open-world">Open World</option><option value="platformer">Platformer</option><option value="rpg">RPG</option><option value="racing">Racing</option><option value="sports">Sports</option></select></label><label>Desenvolvedor<input id="newGameDeveloper"></label><label>Publicadora<input id="newGamePublisher"></label><label>Lançamento<input id="newGameRelease"></label><label>Plataformas<input id="newGamePlatforms" placeholder="PC, PlayStation 5, Xbox"></label><label>Gêneros<input id="newGameGenres" placeholder="Action, Adventure"></label><label>Franquia<input id="newGameFranchise"></label><label>Site oficial<input id="newGameSite" type="url" placeholder="https://..."></label></div><label>Fontes oficiais adicionais<textarea id="newGameSources" rows="3" placeholder="Uma URL por linha"></textarea></label><label>Descrição<textarea id="newGameDescription" rows="5"></textarea></label><div class="form-grid"><label>Cover URL<input id="newGameCover" type="url" placeholder="https://..."><small>Entra como NEEDS_REVIEW.</small></label><label>Banner URL<input id="newGameBanner" type="url" placeholder="https://..."><small>Entra como NEEDS_REVIEW.</small></label><label>Game Icon URL<input id="newGameIcon" type="url" placeholder="https://..."><small>Entra como NEEDS_REVIEW.</small></label><label>Visual query<input id="newGameVisual" placeholder="Nome oficial do jogo"></label></div><label>Abas iniciais<input id="newGameTabs" placeholder="overview, gameplay, items, maps, lore, guides"><small>Deixe vazio para usar o template escolhido.</small></label><div class="admin-onboarding-options"><label><input id="optKnowledge" type="checkbox" checked> Criar conhecimento inicial</label><label><input id="optArticles" type="checkbox" checked> Gerar artigos iniciais como drafts/review</label><label><input id="optPages" type="checkbox" checked> Iniciar página principal pelo Auto Page Builder</label><label><input id="optDeepResearch" type="checkbox"> Preparar pesquisa profunda</label><label><input id="optPreferOfficial" type="checkbox" checked> Priorizar fontes oficiais</label></div><div class="button-row"><button class="button ghost-button" id="analyzeGame" type="button">Analyze Game</button><button class="button primary-button" type="submit">Add Game</button></div><div id="analysisOutput"></div><div id="addGameOutput"></div></form></main>
