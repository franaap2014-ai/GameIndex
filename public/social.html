<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Social | GameIndex Beta 0.992</title>
<script src="/js/theme-bootstrap.js"></script>
<link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/gameindex-0986.css?v=09915"><link rel="stylesheet" href="/css/gameindex-0991-hf1.css?v=09915">
<script src="/js/shell-0986.js?v=09915" defer></script><script src="/js/social.js?v=09915" defer></script>
</head><body data-page="social"><div id="siteShell"></div>
<main class="gi9915-page">
  <section class="simple-hero"><p class="section-eyebrow">SOCIAL</p><h1>Seu espaço no GameIndex.</h1><p>Amigos, comunidades e conversas em um só lugar.</p></section>
  <div id="socialMessage" class="beta95-message" role="status"></div>
  <section class="gi9915-social-shell">
    <nav class="gi9915-social-nav gi9915-card" aria-label="Social">
      <button class="active" data-social-tab="feed">Feed</button>
      <button data-social-tab="friends">Amigos</button>
      <button data-social-tab="communities">Comunidades</button>
      <button data-social-tab="messages">Mensagens</button>
    </nav>
    <div class="gi9915-social-main">
      <section id="socialComposer" class="gi9915-composer gi9915-card">
        <textarea id="socialPostContent" maxlength="2200" placeholder="O que está acontecendo?"></textarea>
        <div class="gi9915-composer-foot">
          <div><select id="socialPostContext"><option value="">Sem jogo específico</option></select></div>
          <button id="socialPostSubmit" class="gi9915-button primary" type="button">Publicar</button>
        </div>
      </section>
      <section id="socialPrimary" class="gi9915-card"><div class="content-skeleton"></div></section>
      <button id="socialMore" class="gi9915-button ghost" type="button" hidden>Carregar mais</button>
    </div>
    <aside id="socialSide" class="gi9915-social-side gi9915-card">
      <p class="gi9915-kicker">ATALHOS</p>
      <a class="gi9915-button ghost" href="/profile.html">Meu perfil</a>
      <a class="gi9915-button ghost" href="/games.html">Explorar jogos</a>
      <button id="socialNotifications" class="gi9915-button ghost" type="button">Notificações</button>
    </aside>
  </section>
</main>
<div id="socialModal" class="ae-modal" hidden><div class="ae-modal-card"><div class="section-title-row"><div><p class="gi9915-kicker">SOCIAL</p><h2 id="socialModalTitle">Comunidade</h2></div><button id="socialModalClose" class="ae-mini-btn" type="button">×</button></div><div id="socialModalBody"></div></div></div>
</body></html>
