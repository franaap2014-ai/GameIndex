<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cinematic Test Lab | GameIndex Beta 0.9915</title>
<script src="/js/theme-bootstrap.js"></script>
<link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/gameindex-0986.css?v=09915"><link rel="stylesheet" href="/css/animation-runtime.css?v=09915">
<script src="/js/shell-0986.js?v=09915" defer></script><script src="/js/animation-runtime.js?v=09915" defer></script><script src="/js/cinematic-test-lab.js?v=09915" defer></script>
</head><body data-page="cinematic-test-lab"><div id="siteShell"></div>
<main class="gi9915-testlab">
<section class="simple-hero"><p class="section-eyebrow">VISUAL · SANDBOX</p><h1>Cinematic Test Lab</h1><p>Teste cutscenes em diferentes cenários sem alterar histórico, tema ou publicação.</p></section>
<div id="ctlMessage" class="beta95-message" role="status"></div>
<section class="gi9915-testlab-grid">
  <aside class="gi9915-testlab-controls gi9915-card">
    <label>Fonte<select id="ctlSourceType"><option value="EXISTING">Cutscene do sistema</option><option value="PROJECT">Projeto do editor</option><option value="GAME">Entrada de jogo</option></select></label>
    <label id="ctlExistingRow">Cutscene<select id="ctlExisting"></select></label>
    <label id="ctlProjectRow" hidden>Projeto<select id="ctlProject"></select></label>
    <label id="ctlGameRow" hidden>Jogo<select id="ctlGame"></select></label>
    <label>Identidade<select id="ctlIdentity"><option>FREE</option><option>PRO</option><option>TESTER</option><option>DEV</option><option>CREATOR</option></select></label>
    <label>Tema<select id="ctlTheme"><option>FREE_DARK</option><option>FREE_LIGHT</option><option>PRO_DARK</option><option>TESTER_DARK</option><option>DEV_DARK</option><option>CREATOR_DARK</option></select></label>
    <label>Viewport<select id="ctlViewport"><option>DESKTOP</option><option>NOTEBOOK</option><option>TABLET</option><option>MOBILE</option></select></label>
    <label><span><input id="ctlReduced" type="checkbox"> Reduced Motion</span></label>
    <label><span><input id="ctlSlow" type="checkbox"> Slow Preview</span></label>
    <label><span><input id="ctlLoop" type="checkbox"> Loop</span></label>
    <div class="gi9915-profile-actions"><button id="ctlPlay" class="gi9915-button primary" type="button">▶ Play</button><button id="ctlReplay" class="gi9915-button" type="button">↺ Replay</button><button id="ctlPause" class="gi9915-button ghost" type="button">⏸</button></div>
    <hr>
    <p class="gi9915-kicker">SEQUENCE TEST</p>
    <button id="ctlAddSequence" class="gi9915-button ghost" type="button">+ Adicionar atual</button>
    <div id="ctlSequence" class="admin-list"></div>
    <button id="ctlRunSequence" class="gi9915-button" type="button">Executar sequência</button>
    <button id="ctlClearSequence" class="gi9915-button ghost" type="button">Limpar</button>
  </aside>
  <section class="gi9915-card">
    <div class="gi9915-testlab-stage-wrap"><div id="ctlStage" class="gi9915-testlab-stage" data-viewport="DESKTOP"><div class="gi9915-social-empty">Escolha uma cutscene e pressione Play.</div></div></div>
    <div class="gi9915-testlab-toolbar"><span id="ctlTime">0.00s / 0.00s</span><span id="ctlSandbox" class="trace-pill ok">SANDBOX</span></div>
    <p id="ctlMeta" class="gi9915-testlab-meta">Nenhum teste modifica o estado real da conta.</p>
  </section>
</section>
</main></body></html>
