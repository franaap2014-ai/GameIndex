<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Personalization Manager | GameIndex Beta 0.99</title><script src="/js/theme-bootstrap.js"></script><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/gameindex-0986.css?v=0991"><link rel="stylesheet" href="/css/experience-engine.css?v=09875hf11imageinteractionfix"><script src="/js/shell-0986.js?v=0991" defer></script><script src="/js/gameindex-0991.js?v=0991" defer></script><script src="/js/game-experience-manager.js?v=09875hf11imageinteractionfix" defer></script><link rel="stylesheet" href="/css/gameindex-0991.css?v=0991"></head><body><div id="siteShell"></div><main class="image-manager-page"><header><p class="section-eyebrow">DEV / CREATOR · Beta 0.99</p><h1>Personalization Manager</h1><p>Game Index Base → User Theme → Game → Experience → Era → Media → Music. Preview não grava no banco.</p></header><section class="security-card"><div class="image-manager-toolbar"><select id="gemGame" aria-label="Jogo"></select><select id="gemExperience" aria-label="Experiência"></select><select id="gemEra" aria-label="Era"><option value="">Sem era específica</option></select><button id="gemReload" type="button">Atualizar</button></div><form id="gemForm" class="security-form"><label>Nome<input id="gemLabel" maxlength="80"></label><label>Subtítulo<input id="gemSubtitle" maxlength="180"></label><div class="image-editor-grid"><label>Identidade<input id="gemIdentity" placeholder="roblox-og-classic"></label><label>Cor principal<input id="gemAccent" placeholder="#2f78c4"></label><label>Cor secundária<input id="gemAccent2" placeholder="#d52b2b"></label><label>Raio<input id="gemRadius" type="number" min="0" max="30" value="12"></label><label>Header<select id="gemHeader"><option value="default">GameIndex default</option><option value="ecosystem-modern">Ecosystem Modern</option><option value="ecosystem-classic">Ecosystem Classic</option><option value="compact">Compact</option></select></label><label>Cards<select id="gemCard"><option value="default">Default</option><option value="modern">Modern</option><option value="classic-grid">Classic Grid</option><option value="compact-classic">Compact Classic</option></select></label><label>Navegação<select id="gemNavigation"><option value="default">Default</option><option value="ecosystem-modern">Ecosystem Modern</option><option value="ecosystem-classic">Ecosystem Classic</option></select></label><label>Painéis<select id="gemPanel"><option value="standard">Standard</option><option value="modern-soft">Modern Soft</option><option value="modern-glass">Modern Glass</option><option value="classic-web">Classic Web</option></select></label><label>Botões<select id="gemButton"><option value="default">Default</option><option value="modern-flat">Modern Flat</option><option value="classic-rectangular">Classic Rectangular</option></select></label><label>Densidade<select id="gemDensity"><option value="comfortable">Comfortable</option><option value="compact">Compact</option></select></label><label>Fonte de título<input id="gemDisplayFont" placeholder="Inter, Segoe UI, Arial, sans-serif"></label><label>Fonte de cabeçalho<input id="gemHeadingFont"></label><label>Fonte do corpo<input id="gemBodyFont"></label><label>Espaçamento<input id="gemLetterSpacing" placeholder="0.01em"></label><label>Transição (ms)<input id="gemMotion" type="number" min="0" max="600" value="220"></label><label>Era padrão<input id="gemDefaultEra" placeholder="classic-web"></label><label>Chave da era a editar<input id="gemEraKey" placeholder="classic-web"></label></div><label>Menu (JSON, apenas dados)<textarea id="gemMenu" rows="10" spellcheck="false" placeholder='[{"id":"overview","label":"Visão geral","order":10}]'></textarea></label><div class="image-manager-actions"><button id="gemPreviewBtn" type="button">Preview local</button><button type="submit">Salvar experiência</button><button id="gemSaveEra" type="button">Salvar era</button><button id="gemInspect" type="button">Inspector</button><a class="button" href="/image-library.html">Image Manager</a><a class="button" href="/music-manager">Music Manager</a></div><div id="gemStatus" class="image-manager-status" aria-live="polite"></div></form></section><section class="security-card"><p class="section-eyebrow">PREVIEW / INSPECTOR</p><div id="gemPreview" style="border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:18px"><strong>Preview local</strong><p>Altere os campos e clique em Preview local. Nenhuma escrita é feita.</p></div><pre id="gemInspector" style="white-space:pre-wrap;overflow:auto;max-height:420px"></pre></section></main></body></html>
