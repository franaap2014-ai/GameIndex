name: HF2 validation

on:
  push:
    branches:
      - beta-0.991-i1-hf2

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:0991hf1
      - run: npm run test:0991i1
      - run: npm run test:0991i1hf1
      - run: npm run test:0991i1hf2
      - run: npm run smoke
