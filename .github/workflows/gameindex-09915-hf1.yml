name: GameIndex 0.9915 HF1 Recovery

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - hotfix/0.9915-i1-hf1-full-recovery
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm
      - name: Install
        run: npm ci
      - name: Syntax check
        run: npm run check
      - name: HF1 source regression
        run: npm run test:09915hf1
      - name: 0.9915 cinematic regression
        run: npm run test:09915
      - name: HTTP smoke
        run: npm run smoke

  update-only:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build UPDATE ONLY package
        shell: bash
        run: |
          set -euo pipefail
          ROOT="GameIndex_Beta_0.9915_I1_HF1_UPDATE_ONLY"
          mkdir -p "$ROOT/public/css" "$ROOT/public/js" "$ROOT/src/config" "$ROOT/src/database/migrations" "$ROOT/src/database/repositories" "$ROOT/src/database"
          cp .env.example "$ROOT/.env.example"
          cp package.json "$ROOT/package.json"
          cp server.mjs "$ROOT/server.mjs"
          cp public/cinematic-test-lab.html "$ROOT/public/cinematic-test-lab.html"
          cp public/css/gameindex-09915.css "$ROOT/public/css/gameindex-09915.css"
          cp public/js/shell-0986.js "$ROOT/public/js/shell-0986.js"
          cp src/config/release-099i6.mjs "$ROOT/src/config/release-099i6.mjs"
          cp src/database/connection.mjs "$ROOT/src/database/connection.mjs"
          cp src/database/seed.mjs "$ROOT/src/database/seed.mjs"
          cp src/database/migrations/045_beta_09915_cinematic_update.sql "$ROOT/src/database/migrations/045_beta_09915_cinematic_update.sql"
          cp src/database/migrations/046_beta_09915_i1_hf1_full_recovery.sql "$ROOT/src/database/migrations/046_beta_09915_i1_hf1_full_recovery.sql"
          cp src/database/repositories/favorite-game-repository.mjs "$ROOT/src/database/repositories/favorite-game-repository.mjs"
          cp src/database/repositories/profile-avatar-repository.mjs "$ROOT/src/database/repositories/profile-avatar-repository.mjs"
          cat > "$ROOT/UPDATE_ONLY_FILES.txt" <<'EOF'
          GameIndex Beta 0.9915 I1 HF1 — UPDATE ONLY

          Substitua/adicione estes arquivos na base Beta 0.9915 mantendo a estrutura de pastas:

          .env.example
          package.json
          server.mjs
          public/cinematic-test-lab.html
          public/css/gameindex-09915.css
          public/js/shell-0986.js
          src/config/release-099i6.mjs
          src/database/connection.mjs
          src/database/seed.mjs
          src/database/migrations/045_beta_09915_cinematic_update.sql
          src/database/migrations/046_beta_09915_i1_hf1_full_recovery.sql
          src/database/repositories/favorite-game-repository.mjs
          src/database/repositories/profile-avatar-repository.mjs

          Public version: Beta 0.9915
          Internal release: 0.9915 I1 HF1
          Target schema: 46
          EOF
          zip -r "GameIndex_Beta_0.9915_I1_HF1_UPDATE_ONLY.zip" "$ROOT"
      - name: Upload UPDATE ONLY artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameIndex_Beta_0.9915_I1_HF1_UPDATE_ONLY
          path: GameIndex_Beta_0.9915_I1_HF1_UPDATE_ONLY.zip
          if-no-files-found: error
          retention-days: 30
