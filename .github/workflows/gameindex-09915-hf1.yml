name: GameIndex 0.992 Delivery

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delivery-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm
      - name: Install
        run: npm ci
      - name: Syntax check
        run: npm run check
      - name: 0.992 delivery contract
        run: npm run test:0992
      - name: HF3 builder regression
        run: npm run test:hf3
      - name: I2 mobile/music/session regression
        run: npm run test:i2
      - name: HTTP smoke
        run: npm run smoke
